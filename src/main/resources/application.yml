spring:
  application:
    name: starter

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/starter}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: false

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.example.starter: INFO
    org.springframework.security: INFO

app:
  greeting: "hello from default config"
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:changeme}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  rate-limit:
    registration-requests-per-minute: ${RATE_LIMIT_REGISTRATION:100}
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:10}
